name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      MONGO_URI: mongodb://localhost:27017/authforge_ci
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_${{ github.run_id }}
      JWT_REFRESH_SECRET: ci_refresh_secret_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit/integration tests (in-memory model doubles)
        run: npm test

      - name: Run full-stack smoke test against real MongoDB + Redis
        run: npm run test:integration
